server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routing (react-router) owns everything under /.
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy /v1 to the backend in the docker-compose network so the SPA can
    # keep using relative /v1 URLs (see src/api/client.ts) in a containerized deploy.
    location /v1/ {
        proxy_pass http://backend:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
