# Test profile: uses in-memory H2 in PostgreSQL-compatibility mode so the repository
# and tenant-isolation tests run fast and without Docker/Testcontainers in CI.
# JSON payload columns are mapped as plain TEXT (see entity classes) so they are
# portable between H2 (tests) and PostgreSQL (prod), keeping this profile a faithful
# stand-in for the real schema shape.
spring:
  datasource:
    url: jdbc:h2:mem:forge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

forge:
  jwt:
    secret: test-only-secret-do-not-use-in-prod-0123456789abcdef
    access-token-ttl-minutes: 15
    issuer: project-forge-test
  refresh-token:
    ttl-days: 30
    redis-key-prefix: "forge:test:refresh:"
  api-keys:
    hashing-key: test-only-api-key-pepper-0123456789abcdef
    # Rate limiting off in tests: it needs a live Redis, and the limiter fails open, so leaving it
    # on would make the public-API tests silently depend on whether Redis happens to be running.
    rate-limit-per-minute: 0
  billing:
    provider: test-provider
    self-serve-plan-change: true
  mail:
    enabled: false
  sso:
    base-url: http://localhost:8080
    encryption-key: test-only-sso-encryption-key-0123456789abcdef
    login-state-ttl-seconds: 300
  scheduling:
    # Far-future cron and a sweep delay longer than any test run: a background job firing mid-test
    # would mutate usage counters and SSO state underneath assertions. The jobs are exercised
    # directly in MaintenanceJobsTest instead.
    usage-reset-cron: "0 0 0 1 1 ?"
    sso-state-sweep-ms: 86400000
    sso-state-sweep-initial-ms: 86400000
  registration:
    self-service-enabled: false
