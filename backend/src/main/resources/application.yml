spring:
  application:
    name: forge-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forge}
    username: ${SPRING_DATASOURCE_USERNAME:forge}
    password: ${SPRING_DATASOURCE_PASSWORD:forge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

server:
  port: 8080

forge:
  jwt:
    # HMAC secret used to sign access tokens. MUST be overridden via env var in every
    # non-local environment (see .env.example). Minimum 256 bits for HS256.
    secret: ${FORGE_JWT_SECRET:dev-only-insecure-secret-change-me-01234567890123456789}
    access-token-ttl-minutes: ${FORGE_ACCESS_TOKEN_TTL_MINUTES:15}
    issuer: project-forge
  refresh-token:
    ttl-days: ${FORGE_REFRESH_TOKEN_TTL_DAYS:30}
    redis-key-prefix: "forge:refresh:"
  cors:
    allowed-origins: ${FORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.zentrox.forge: INFO
